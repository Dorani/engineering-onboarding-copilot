services:
  db:
    image: pgvector/pgvector:pg16
    container_name: onboarding-postgres
    environment:
      POSTGRES_DB: onboarding
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
    ports:
      - "5432:5432"
    volumes:
      - onboarding_pgdata:/var/lib/postgresql/data

volumes:
  onboarding_pgdata:
